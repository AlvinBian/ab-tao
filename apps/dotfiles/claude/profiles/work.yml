name: work
description: 公司環境（KKday — 強化安全、限制外部 MCP）

# 插件覆蓋
plugins_enabled:
  - commit-commands
  - code-review
  - security-guidance
plugins_disabled:
  - ralph-loop   # 公司環境快速作業，無需對抗式審查
  - code-simplifier

# settings.json 覆蓋（可選）
settings_overrides:
  permissions:
    defaultMode: plan   # 公司環境降為 plan mode 提高安全性

# 記憶範圍（限制在公司相關 patterns）
memory_scope:
  - ~/.claude/memory/preferences/
  - ~/.claude/memory/patterns/

# 備註
notes: |
  KKday 公司環境：降為 plan mode、停用外部 MCP、Ralph Loop 暫停。
  切換指令：d:setup --profile work
