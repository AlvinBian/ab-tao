shell = "zsh"

[templates]
defer = "{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}"

# ── 同步載入（其他插件依賴）──────────────────────────────────────

[plugins.zsh-defer]
github = "romkatv/zsh-defer"
rev = "53a26e287fbbe2dcebb3aa1801546c6de32416fa"

# ── 延遲載入（首次 prompt 後非同步載入）──────────────────────────

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
rev = "85919cd1ffa7d2d5412f6d3fe437ebdbeeec4fc5"
apply = [ "defer" ]

[plugins.fast-syntax-highlighting]
github = "zdharma-continuum/fast-syntax-highlighting"
rev = "3d574ccf48804b10dca52625df13da5edae7f553"
apply = [ "defer" ]

# 被動提醒：使用原始命令時提示已設定的 alias
[plugins.you-should-use]
github = "MichaelAquilina/zsh-you-should-use"
tag = "1.11.1"
apply = [ "defer" ]

# fzf-tab 由 sheldon 下載，但在 90-plugins.zsh 中 compinit 之後手動載入
[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"
rev = "0983009f8666f11e91a2ee1f88cfdb748d14f656"
apply = [ "fpath" ]

# ── 補全（加入 fpath，由 compinit 統一載入）──────────────────────

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
rev = "ed67fbb8ee9ec00abfaecdc3dcfc330202ede323"
dir = "src"
apply = [ "fpath" ]
