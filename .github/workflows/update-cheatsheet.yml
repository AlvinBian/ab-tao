name: 更新 Claude Code 快速參考表（繁體中文）

on:
  schedule:
    # 每日 03:00 UTC（跟隨原站每日更新節奏）
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '強制更新（忽略版本比對）'
        type: boolean
        default: false

concurrency:
  group: update-cheatsheet
  cancel-in-progress: true

jobs:
  # ── 1. 抓取 + 簡轉繁 ──────────────────────────────────────────────────────
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      version: ${{ steps.update.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 執行更新腳本
        id: update
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          node apps/cheatsheet/update.mjs $ARGS

      - name: Commit 並推送（若有變更）
        if: steps.update.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.update.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/cheatsheet/index.html
          git commit -m "docs: 同步 Claude Code 快速參考表 v${VERSION}"
          git push

  # ── 2. 部署至 GitHub Pages ────────────────────────────────────────────────
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 設定 Pages
        uses: actions/configure-pages@v4

      - name: 上傳 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/cheatsheet

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
