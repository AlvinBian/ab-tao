name: GitFlow

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PR 目標分支校驗（main 只允許來自 develop 或 release/* ）──
  validate-pr-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: 校驗合併來源
        env:
          SOURCE: ${{ github.head_ref }}
        run: |
          if [[ "$SOURCE" == "develop" || "$SOURCE" == release/* ]]; then
            echo "✅ 合併來源符合規範：$SOURCE → main"
          else
            echo "::error::main 分支只允許從 develop 或 release/* 合併，不允許：$SOURCE"
            echo "  正確流程：feature/* → develop → release/* → main"
            exit 1
          fi

  # ── PR 分支名校驗 ──
  validate-branch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 校驗分支命名
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # develop / main / release/* 是保護分支，跳過命名校驗
          if [[ "$BRANCH" == "develop" || "$BRANCH" == "main" || "$BRANCH" == release/* ]]; then
            echo "✅ 保護分支，跳過命名校驗：$BRANCH"
            exit 0
          fi
          VALID_PATTERN="^(feature|fix|hotfix|release|refactor|docs|chore|ci|test)/.+"
          if [[ ! "$BRANCH" =~ $VALID_PATTERN ]]; then
            echo "::error::分支名不符合規範：$BRANCH"
            echo "  格式：{type}/{description}"
            echo "  允許的 type：feature, fix, hotfix, release, refactor, docs, chore, ci, test"
            exit 1
          fi
          echo "✅ 分支名符合規範：$BRANCH"

  # ── PR 檢查（lint + build + test）──
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run check:ci

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

  # ── PR commit message 校驗 ──
  validate-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校驗 Conventional Commits
        run: |
          COMMITS=$(git log --format="%s" origin/${{ github.base_ref }}..${{ github.sha }})
          PATTERN="^(feat|fix|refactor|docs|test|chore|perf|ci|build|style|revert)(\(.+\))?!?: .+"
          FAILED=0
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if [[ ! "$msg" =~ $PATTERN ]]; then
              echo "::warning::不符合 Conventional Commits：$msg"
              FAILED=1
            fi
          done <<< "$COMMITS"
          if [ "$FAILED" -eq 1 ]; then
            echo "::notice::建議格式：{type}({scope}): {description}"
          fi

  # ── Release：自動合併到 develop ──
  sync-develop:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 同步 main → develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify origin/develop &>/dev/null; then
            git checkout develop
            git merge main --no-edit || {
              echo "::warning::main → develop 合併衝突，需手動解決"
              exit 0
            }
            git push origin develop
            echo "✅ main → develop 同步完成"
          else
            echo "::notice::develop 分支不存在，跳過同步"
          fi

  # ── Tag 推送時自動建立 GitHub Release ──
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成 Release Notes
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "$TAG" | head -1)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --format="- %s" "$PREV_TAG".."$TAG" | head -50)
          else
            NOTES=$(git log --format="- %s" --max-count=20)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 建立 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: false
